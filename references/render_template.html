<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; }
    #stage { display: inline-block; position: relative; padding: 64px; }
    #root { position: relative; }
    #root svg { display: block; }
  </style>
</head>
<body>
  <div id="stage"><div id="root"></div></div>

  <script type="module">
    import { exportToSvg } from "https://cdn.jsdelivr.net/npm/@excalidraw/excalidraw@0.18.1/+esm";

    window.renderDiagram = async function(jsonData) {
      try {
        const data = typeof jsonData === "string" ? JSON.parse(jsonData) : jsonData;
        const elements = data.elements || [];
        const appState = data.appState || {};
        const files = data.files || {};

        const bg = appState.viewBackgroundColor || "#f8f9fa";
        document.getElementById("stage").style.background = bg;
        document.body.style.background = bg;

        // The stage paints the background, including the padding around the SVG.
        const svg = await exportToSvg({
          elements,
          appState: { ...appState, exportBackground: false, exportWithDarkMode: false },
          files,
        });

        const root = document.getElementById("root");
        root.innerHTML = "";
        root.appendChild(svg);

        await document.fonts.ready;

        window.__renderComplete = true;
        window.__renderError = null;
        return { success: true, width: svg.getAttribute("width"), height: svg.getAttribute("height") };
      } catch (err) {
        window.__renderComplete = true;
        window.__renderError = err.message;
        return { success: false, error: err.message };
      }
    };

    window.__moduleReady = true;
  </script>
</body>
</html>
